<title>อันนี้คือไตเติลนะ</title>
</head>
<body>
	<h1>อันนี้คือเฮดเดอร์</h1>
	<p>อันนี้คือย่อหน้า<br>อันนี้คือบรรทัดถัดไป</p>
	<p>อันนี้คือย่อหน้าที่สอง<hr>อันนี้คือบรรทัดถัดไปอีก</p>
	<p>อันนี้จะเป็น<b>ตัวหนา</b></p>
	<p>อันนี้จะเป็น<i>ตัวเอียง</i></p>
	<p>อันนี้เป็น<u>ตัวขีดเส้นใต้</u></p>
